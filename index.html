<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>조합 생존게임 FX</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#e8f5ff;font-family:Georgia,'Times New Roman',serif}
#game{display:block;width:100vw;height:100vh;background:#050910}
#ui{position:fixed;inset:0;pointer-events:none;color:#dff7ff;text-shadow:0 0 6px #9ee7ff;font-weight:bold}
.leftInfo{position:absolute;left:7%;top:6%;font-size:27px;line-height:1.55}
.rightInfo{position:absolute;right:7%;top:6%;font-size:21px;text-align:center;line-height:1.2}
.expOuter{position:absolute;left:35%;top:17%;width:56%;height:18px;background:#092915;border:1px solid #0b6b32;box-shadow:0 0 14px #00ff66 inset,0 0 12px rgba(0,255,102,.35)}
.expInner{height:100%;width:0%;background:linear-gradient(90deg,#00ff66,#b7ff4a,#ffffff);box-shadow:0 0 18px #00ff66}
#weaponList{position:absolute;left:4%;bottom:3%;font:800 12px system-ui,sans-serif;color:#dbeafe;text-shadow:0 0 5px #000;max-width:62%;line-height:1.55;background:rgba(2,6,23,.35);padding:8px 10px;border-radius:12px;border:1px solid rgba(148,163,184,.18)}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:900 21px system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.25);padding:13px 17px;border-radius:16px;opacity:0;transition:.25s;text-align:center;white-space:pre-line;box-shadow:0 0 40px rgba(255,255,255,.14)}
#levelPanel{position:fixed;inset:0;display:none;place-items:center;background:radial-gradient(circle,rgba(37,99,235,.25),rgba(0,0,0,.78));z-index:20;font-family:system-ui,sans-serif;color:#fff;pointer-events:auto}.panel{width:min(94vw,470px);background:linear-gradient(180deg,#13213a,#090f1f);border:1px solid #60a5fa;border-radius:24px;padding:18px;box-shadow:0 20px 80px #000,0 0 45px rgba(96,165,250,.25)}.panel h2{margin:0 0 12px;font-size:25px;text-align:center;letter-spacing:2px}.choice{display:block;width:100%;margin:9px 0;padding:14px;border:1px solid #3b82f6;background:linear-gradient(135deg,#172554,#1e3a8a);color:white;border-radius:17px;font-weight:950;text-align:left;box-shadow:0 8px 22px rgba(0,0,0,.25)}.choice small{display:block;color:#bfdbfe;margin-top:4px;font-weight:650}.combo{border-color:#f59e0b;background:linear-gradient(135deg,#3b2506,#7c2d12);box-shadow:0 0 25px rgba(245,158,11,.28)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"><div class="leftInfo">Lv. <span id="lvA">1</span><br><span id="mainWeapon">기관총 Lv.1</span></div><div class="rightInfo">Lv. <span id="lvB">1</span><br>EXP <span id="expNow">0</span>/<span id="expMax">5</span></div><div class="expOuter"><div class="expInner" id="expBar"></div></div><div id="weaponList"></div><div id="toast"></div></div>
<div id="levelPanel"><div class="panel"><h2>LEVEL UP</h2><div id="choices"></div></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const WEAPONS={gun:['🔫','기관총'],skull:['💀','해골'],missile:['🔮','매직미사일'],sword:['⚔️','검'],lightning:['⚡','낙뢰'],chain:['🔗','체인'],blackhole:['🌑','블랙홀'],boomerang:['🪃','부메랑'],laser:['🔴','레이저'],lung:['🫁','유지호의 폐'],scythe:['⛓️','대낫']};
const COMBOS=[['lightning','chain','stormnet','🌩️','뇌전망','전장 전체 감전 그물'],['blackhole','boomerang','gravityScythe','🌀','중력낫','왕복 흡입 경로 폭발'],['gun','skull','poisonGun','☠️','독탄기관총','독 스택과 독구름'],['missile','sword','magicSwordsman','🗡️','마법검사','검 궤적 추적 미사일'],['laser','lung','pyroBeam','🔥','열분해포','레이저 화염 폭발 지대'],['sword','boomerang','stormSword','🌪️','폭풍검','왕복 관통 회오리'],['skull','blackhole','plagueEye','👁️','역병의 눈','흡입 독 저주 확산'],['lightning','laser','plasmaBeam','☄️','플라즈마 빔','레이저 낙뢰 연쇄'],['lung','boomerang','boomBoomerang','💥','폭발 부메랑','왕복 폭발 카펫'],['gun','missile','multiMissile','🚀','다연장 추적포','기관총식 추적 미사일'],['chain','scythe','deathScythe','💀','사신의 낫','체인 구속 연속 베기']];
let owned={gun:1},comboOwned={};let player={x:0,y:0,r:16,speed:235,hp:100,angle:0},cam={x:0,y:0,shake:0},keys={},bullets=[],enemies=[],gems=[],areas=[],slashes=[],booms=[],sparks=[],texts=[],trails=[],rings=[];let level=1,exp=0,need=5,paused=false,time=0,spawnTimer=0,fire={gun:0,missile:0,lightning:0,blackhole:0,boomerang:0,laser:0,sword:0,chain:0,skull:0,lung:0,scythe:0,combo:0};const joy={active:false,id:null,cx:130,cy:H-210,x:130,y:H-210,dx:0,dy:0};
function ws(x,y){return{x:x-cam.x+W/2,y:y-cam.y+H/2}}function rand(a,b){return Math.random()*(b-a)+a}function d(a,b,c,d){return Math.hypot(a-c,b-d)}function near(){let best=null,bd=1e9;for(const e of enemies){let dd=d(player.x,player.y,e.x,e.y);if(dd<bd){bd=dd;best=e}}return best}function angTo(e){return e?Math.atan2(e.y-player.y,e.x-player.x):player.angle}
function fx(x,y,color='#ffd166',count=14,power=240){for(let i=0;i<count;i++){let a=rand(0,Math.PI*2),s=rand(power*.18,power);sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.75),max:.75,r:rand(2,5),color})}}
function ring(x,y,color='#fff',r=80){rings.push({x,y,color,r,life:.45,max:.45})}function dmgText(x,y,t,color='#fff'){texts.push({x,y,t,color,life:.62,vy:-58})}
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);canvas.addEventListener('pointerdown',e=>{joy.active=true;joy.id=e.pointerId;joy.cx=e.clientX;joy.cy=e.clientY;joy.x=e.clientX;joy.y=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!joy.active||e.pointerId!==joy.id)return;let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy,m=Math.hypot(dx,dy),max=78;if(m>max){dx=dx/m*max;dy=dy/m*max}joy.dx=dx/max;joy.dy=dy/max;joy.x=joy.cx+dx;joy.y=joy.cy+dy});canvas.addEventListener('pointerup',e=>{if(e.pointerId===joy.id){joy.active=false;joy.dx=joy.dy=0;joy.x=joy.cx;joy.y=joy.cy}});
function shoot(type,a,extra={}){let sp=extra.sp||650,life=extra.life||1.2,r=extra.r||5,dmg=extra.dmg||1,color=extra.color||'#ffff55';bullets.push({type,x:player.x+Math.cos(a)*22,y:player.y+Math.sin(a)*22,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r,life,dmg,color,pierce:extra.pierce||0,poison:extra.poison||0,boom:extra.boom||0,homing:extra.homing||false});if(Math.random()<.6)fx(player.x+Math.cos(a)*25,player.y+Math.sin(a)*25,color,3,90)}
function spawnEnemy(){let side=Math.floor(rand(0,4)),x=player.x,y=player.y,m=560;if(side===0){x+=rand(-W,W);y-=m}else if(side===1){x+=rand(-W,W);y+=m}else if(side===2){x-=m;y+=rand(-H,H)}else{x+=m;y+=rand(-H,H)}let hp=3+Math.floor(time/35);enemies.push({x,y,r:17,hp,max:hp,speed:70+Math.min(90,time*1.2),poison:0,curse:0,bind:0,hit:0})}
function addGem(x,y){gems.push({x,y,r:7,value:1,spin:rand(0,7)})}function area(x,y,r,life,dmg,type,extra={}){areas.push({x,y,r,life,max:life,dmg,type,tick:0,...extra})}function boom(x,y,r=58){booms.push({x,y,r,life:.32,max:.32});area(x,y,r,.22,2,'boom');fx(x,y,'#ffb84d',30,360);ring(x,y,'#ffd166',r*1.45);cam.shake=Math.max(cam.shake,10)}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;setTimeout(()=>el.style.opacity=0,1150)}
function gainExp(v){exp+=v;fx(player.x,player.y,'#55ff88',12,190);while(exp>=need){exp-=need;level++;need=Math.floor(need*1.42+3);fx(player.x,player.y,'#8ec5ff',90,520);ring(player.x,player.y,'#8ec5ff',220);cam.shake=18;openLevel()}ui()}function openLevel(){paused=true;let pool=[];for(const [k,v] of Object.entries(WEAPONS)){if(!owned[k]||owned[k]<5)pool.push({k,text:`${v[0]} ${v[1]} ${owned[k]?`Lv.${owned[k]+1}`:'획득'}`,desc:owned[k]?'위력/빈도 증가':'새 무기 해금'})}for(const c of COMBOS){if(owned[c[0]]&&owned[c[1]]&&!comboOwned[c[2]])pool.unshift({k:'combo:'+c[2],combo:c,text:`${c[3]} ${c[4]} 조합`,desc:`${WEAPONS[c[0]][1]} + ${WEAPONS[c[1]][1]} → ${c[5]}`})}pool=pool.sort(()=>Math.random()-.5).slice(0,3);choices.innerHTML=pool.map((p,i)=>`<button class="choice ${p.combo?'combo':''}" onclick="pick(${i})">${p.text}<small>${p.desc}</small></button>`).join('');window._pool=pool;levelPanel.style.display='grid'}
function pick(i){let p=window._pool[i];if(p.combo){comboOwned[p.combo[2]]=true;fx(player.x,player.y,'#f59e0b',120,600);ring(player.x,player.y,'#f59e0b',300);cam.shake=24;toast(`${p.combo[3]} ${p.combo[4]} 완성!\n${p.combo[5]}`)}else{owned[p.k]=(owned[p.k]||0)+1;fx(player.x,player.y,'#93c5fd',45,330);toast(`${WEAPONS[p.k][0]} ${WEAPONS[p.k][1]} 강화`)}paused=false;levelPanel.style.display='none';ui()}window.pick=pick;
function ui(){lvA.textContent=level;lvB.textContent=level;expNow.textContent=exp;expMax.textContent=need;expBar.style.width=Math.min(100,exp/need*100)+'%';let list=[...Object.entries(owned).map(([k,v])=>`${WEAPONS[k][0]} ${WEAPONS[k][1]} Lv.${v}`),...Object.entries(comboOwned).map(([k])=>{let c=COMBOS.find(x=>x[2]===k);return `${c[3]} ${c[4]}`})];mainWeapon.textContent=list[0]||'무기 없음';weaponList.innerHTML=list.join('<br>')}
function weaponUpdate(dt){let e=near(),a=angTo(e);if(owned.gun&&(fire.gun-=dt)<=0){shoot('gun',a,{dmg:1+owned.gun*.35,poison:comboOwned.poisonGun?1:0,homing:comboOwned.multiMissile,color:comboOwned.poisonGun?'#76ff4f':'#fff36a'});fire.gun=comboOwned.multiMissile?.08:Math.max(.08,.24-owned.gun*.025)}if(owned.missile&&(fire.missile-=dt)<=0){for(let i=0;i<owned.missile;i++)shoot('missile',a+rand(-.6,.6),{sp:420,homing:true,r:7,dmg:2,color:'#b388ff'});fire.missile=comboOwned.multiMissile?.18:1.2}if(owned.sword&&(fire.sword-=dt)<=0){slashes.push({x:player.x,y:player.y,a,life:.25,max:.25,r:75+owned.sword*10,dmg:2+owned.sword,color:'#bfdbfe'});ring(player.x,player.y,'#bfdbfe',95+owned.sword*12);if(comboOwned.magicSwordsman)for(let i=0;i<3;i++)shoot('missile',a+rand(-.4,.4),{homing:true,sp:520,dmg:2,color:'#c084fc'});if(comboOwned.stormSword)shoot('stormSword',a,{sp:430,life:1.7,r:16,dmg:4,pierce:99,color:'#67e8f9'});fire.sword=.85}if(owned.lightning&&(fire.lightning-=dt)<=0){for(let i=0;i<owned.lightning;i++){let t=enemies[Math.floor(Math.random()*enemies.length)];if(t){area(t.x,t.y,52,.22,3,'lightning');fx(t.x,t.y,'#7dd3fc',18,270);ring(t.x,t.y,'#7dd3fc',75);if(comboOwned.plasmaBeam)for(const n of enemies)if(d(t.x,t.y,n.x,n.y)<140){n.hp-=2;fx(n.x,n.y,'#93c5fd',5,140)}}}fire.lightning=comboOwned.stormnet?.8:1.45}if(owned.blackhole&&(fire.blackhole-=dt)<=0){if(comboOwned.gravityScythe)shoot('blackhole',a,{sp:260,life:2.4,r:36,dmg:2,pierce:99,color:'#7c3aed'});else area(player.x+Math.cos(a)*180,player.y+Math.sin(a)*180,100,2.2,1,'blackhole');fire.blackhole=4}if(owned.boomerang&&(fire.boomerang-=dt)<=0){shoot('boomerang',a,{sp:360,life:1.9,r:14,dmg:3,pierce:99,boom:comboOwned.boomBoomerang?1:0,color:'#87e6ff'});fire.boomerang=2.2}if(owned.laser&&(fire.laser-=dt)<=0){let len=540;areas.push({x:player.x+Math.cos(a)*len/2,y:player.y+Math.sin(a)*len/2,r:32,life:.42,max:.42,dmg:comboOwned.pyroBeam?4:2,type:'laser',a,len});ring(player.x+Math.cos(a)*280,player.y+Math.sin(a)*280,comboOwned.pyroBeam?'#fb7185':'#f43f5e',90);if(comboOwned.pyroBeam){for(let i=1;i<6;i++)boom(player.x+Math.cos(a)*i*105,player.y+Math.sin(a)*i*105,45)}fire.laser=1.7}if(owned.chain&&(fire.chain-=dt)<=0){for(let i=0;i<Math.min(owned.chain+1,enemies.length);i++){let t=enemies[i];if(t&&d(player.x,player.y,t.x,t.y)<380){t.bind=.85;t.hp-=2;fx(t.x,t.y,'#9ee7ff',8,150);if(comboOwned.deathScythe){t.x+=(player.x-t.x)*.08;t.y+=(player.y-t.y)*.08;t.hp-=3;slashes.push({x:t.x,y:t.y,a:Math.atan2(t.y-player.y,t.x-player.x),life:.18,max:.18,r:55,dmg:2,color:'#e9d5ff'})}}}fire.chain=comboOwned.stormnet?.45:1.2}if(comboOwned.plagueEye&&(fire.combo-=dt)<=0){let t=near();if(t){area(t.x,t.y,130,2.3,1,'plague');fx(t.x,t.y,'#a855f7',28,260)}fire.combo=3.2}}
function update(dt){if(paused)return;time+=dt;let mx=0,my=0;if(keys.w||keys.arrowup)my--;if(keys.s||keys.arrowdown)my++;if(keys.a||keys.arrowleft)mx--;if(keys.d||keys.arrowright)mx++;if(joy.active){mx=joy.dx;my=joy.dy}let m=Math.hypot(mx,my);if(m>0){mx/=m;my/=m;player.x+=mx*player.speed*dt;player.y+=my*player.speed*dt;player.angle=Math.atan2(my,mx)}cam.x=player.x+(Math.random()-.5)*cam.shake;cam.y=player.y+(Math.random()-.5)*cam.shake;cam.shake=Math.max(0,cam.shake-40*dt);trails.push({x:player.x,y:player.y,a:player.angle,life:.22,max:.22,color:'#a78bfa',player:true});if(trails.length>90)trails.shift();spawnTimer-=dt;if(spawnTimer<=0){for(let i=0;i<1+Math.floor(time/23);i++)spawnEnemy();spawnTimer=Math.max(.16,.75-time/130)}weaponUpdate(dt);
for(const b of bullets){if(b.homing){let t=near();if(t){let aa=Math.atan2(t.y-b.y,t.x-b.x);b.vx=b.vx*.88+Math.cos(aa)*650*.12;b.vy=b.vy*.88+Math.sin(aa)*650*.12}}b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(Math.random()<.45)trails.push({x:b.x,y:b.y,a:Math.atan2(b.vy,b.vx),life:.18,max:.18,color:b.color,bullet:true});if(b.boom&&Math.random()<.18)boom(b.x,b.y,42)}bullets=bullets.filter(b=>b.life>0);
for(const e of enemies){let a=Math.atan2(player.y-e.y,player.x-e.x),spd=e.bind>0?e.speed*.2:e.speed;e.x+=Math.cos(a)*spd*dt;e.y+=Math.sin(a)*spd*dt;e.hit=Math.max(0,e.hit-dt);e.bind=Math.max(0,e.bind-dt);if(e.poison>0){e.hp-=e.poison*dt;e.poison-=dt*.22;if(Math.random()<.08)fx(e.x,e.y,'#6ee735',2,80)}if(d(e.x,e.y,player.x,player.y)<e.r+player.r){player.hp-=10*dt;cam.shake=Math.max(cam.shake,5)}}
for(const ar of areas){ar.life-=dt;ar.tick-=dt;for(const e of enemies){let hit=false;if(ar.type==='laser'){let px=e.x-(ar.x-Math.cos(ar.a)*ar.len/2),py=e.y-(ar.y-Math.sin(ar.a)*ar.len/2);let proj=Math.max(0,Math.min(ar.len,px*Math.cos(ar.a)+py*Math.sin(ar.a)));let lx=ar.x-Math.cos(ar.a)*ar.len/2+Math.cos(ar.a)*proj,ly=ar.y-Math.sin(ar.a)*ar.len/2+Math.sin(ar.a)*proj;hit=d(e.x,e.y,lx,ly)<38}else hit=d(e.x,e.y,ar.x,ar.y)<ar.r;if(hit){e.hp-=ar.dmg*dt*8;e.hit=.05;if(Math.random()<.07)fx(e.x,e.y,ar.type==='plague'?'#a855f7':ar.type==='poison'?'#4ade80':'#93c5fd',3,90);if(ar.type==='blackhole'||ar.type==='plague'){e.x+=(ar.x-e.x)*dt*1.6;e.y+=(ar.y-e.y)*dt*1.6;e.poison+=.025}}}}
areas=areas.filter(a=>a.life>0);slashes=slashes.filter(s=>(s.life-=dt)>0);booms=booms.filter(b=>(b.life-=dt)>0);rings=rings.filter(r=>(r.life-=dt)>0);for(const sp of sparks){sp.x+=sp.vx*dt;sp.y+=sp.vy*dt;sp.vx*=.92;sp.vy*=.92;sp.life-=dt}sparks=sparks.filter(s=>s.life>0);for(const tx of texts){tx.y+=tx.vy*dt;tx.life-=dt}texts=texts.filter(t=>t.life>0);for(const tr of trails){tr.life-=dt}trails=trails.filter(t=>t.life>0);
for(const b of bullets){for(const e of enemies){if(e.hp>0&&d(b.x,b.y,e.x,e.y)<b.r+e.r){e.hp-=b.dmg;e.hit=.08;dmgText(e.x,e.y,Math.ceil(b.dmg),'#fef08a');fx(e.x,e.y,b.poison?'#6ee735':'#fff36a',8,170);if(b.poison)e.poison+=1.8;if(b.boom)boom(e.x,e.y,55);if(b.pierce>0)b.pierce--;else b.life=0;break}}}for(const s of slashes){for(const e of enemies){if(d(s.x,s.y,e.x,e.y)<s.r){e.hp-=s.dmg*dt*8;e.hit=.05;if(Math.random()<.08)fx(e.x,e.y,s.color||'#bfdbfe',3,120)}}}
for(const e of enemies){if(e.hp<=0&&!e.dead){e.dead=true;addGem(e.x,e.y);fx(e.x,e.y,e.poison>0?'#6ee735':'#ff7070',14,230);ring(e.x,e.y,e.poison>0?'#6ee735':'#ff7070',55);if(comboOwned.poisonGun&&e.poison>0)area(e.x,e.y,68,1.4,1,'poison')}}enemies=enemies.filter(e=>!e.dead);
for(const g of gems){g.spin+=dt*7;let dd=d(g.x,g.y,player.x,player.y);if(dd<150){let a=Math.atan2(player.y-g.y,player.x-g.x);g.x+=Math.cos(a)*400*dt;g.y+=Math.sin(a)*400*dt}if(dd<player.r+g.r+7){g.dead=true;gainExp(g.value)}}gems=gems.filter(g=>!g.dead)}
function drawGrid(){let grad=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,Math.max(W,H));grad.addColorStop(0,'#0b1730');grad.addColorStop(.45,'#060b16');grad.addColorStop(1,'#02040a');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);let s=165,ox=(-cam.x%s)+W/2%s,oy=(-cam.y%s)+H/2%s;for(let x=ox-s;x<W+s;x+=s)for(let y=oy-s;y<H+s;y+=s){ctx.fillStyle=((x/s+y/s)|0)%2?'rgba(10,17,27,.55)':'rgba(13,23,32,.55)';ctx.fillRect(x,y,s,s);ctx.strokeStyle='rgba(35,55,86,.75)';ctx.lineWidth=3;ctx.strokeRect(x,y,s,s)}ctx.globalAlpha=.12;ctx.strokeStyle='#60a5fa';ctx.lineWidth=1;for(let i=0;i<9;i++){ctx.beginPath();ctx.arc(W/2,H/2,90+i*100+(time*22)%100,0,7);ctx.stroke()}ctx.globalAlpha=1}
function draw(){drawGrid();for(const tr of trails){let p=ws(tr.x,tr.y);ctx.save();ctx.globalAlpha=Math.max(0,tr.life/tr.max)*(tr.player?.28:.42);ctx.translate(p.x,p.y);ctx.rotate(tr.a);ctx.fillStyle=tr.color||'#fff';ctx.shadowColor=tr.color||'#fff';ctx.shadowBlur=10;ctx.beginPath();ctx.ellipse(0,0,tr.bullet?16:24,tr.bullet?4:10,0,0,7);ctx.fill();ctx.restore();ctx.shadowBlur=0;ctx.globalAlpha=1}
for(const ar of areas){let p=ws(ar.x,ar.y);ctx.globalAlpha=Math.max(.18,ar.life/ar.max*.52);if(ar.type==='laser'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ar.a);let grd=ctx.createLinearGradient(-ar.len/2,0,ar.len/2,0);grd.addColorStop(0,'rgba(255,255,255,.1)');grd.addColorStop(.5,comboOwned.pyroBeam?'#ff5522':'#ff2244');grd.addColorStop(1,'rgba(255,255,255,.1)');ctx.fillStyle=grd;ctx.shadowColor=comboOwned.pyroBeam?'#fb7185':'#f43f5e';ctx.shadowBlur=22;ctx.fillRect(-ar.len/2,-13,ar.len,26);ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(-ar.len/2,-3,ar.len,6);ctx.restore();ctx.shadowBlur=0}else{ctx.fillStyle=ar.type==='blackhole'?'#201040':ar.type==='poison'?'#48bb3d':ar.type==='plague'?'#4b103c':ar.type==='lightning'?'#7dd3fc':'#ffb84d';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=20;ctx.beginPath();ctx.arc(p.x,p.y,ar.r,0,7);ctx.fill();ctx.shadowBlur=0}ctx.globalAlpha=1}
for(const r of rings){let p=ws(r.x,r.y),q=1-r.life/r.max;ctx.globalAlpha=r.life/r.max;ctx.strokeStyle=r.color;ctx.lineWidth=8*(1-q)+1;ctx.shadowColor=r.color;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(p.x,p.y,r.r*q,0,7);ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=1}
for(const g of gems){let p=ws(g.x,g.y);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(g.spin);ctx.fillStyle='#b5c848';ctx.shadowColor='#eaff68';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(9,0);ctx.lineTo(0,10);ctx.lineTo(-9,0);ctx.closePath();ctx.fill();ctx.restore();ctx.shadowBlur=0}
for(const b of bullets){let p=ws(b.x,b.y);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(b.vy,b.vx));ctx.fillStyle=b.type==='blackhole'?'#1d123f':b.type==='boomerang'||b.type==='stormSword'?'#87e6ff':b.color;ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=14;ctx.beginPath();if(b.type==='boomerang'||b.type==='stormSword'){ctx.arc(0,0,b.r,0.4,5.6);ctx.lineWidth=6;ctx.strokeStyle=ctx.fillStyle;ctx.stroke()}else{ctx.arc(0,0,b.r,0,7);ctx.fill()}ctx.restore();ctx.shadowBlur=0}
for(const e of enemies){let p=ws(e.x,e.y);ctx.fillStyle=e.poison>0?'#719c3b':e.hit>0?'#ffb4b4':'#d63b3b';ctx.shadowColor=e.poison>0?'#6ee735':'#ff4040';ctx.shadowBlur=e.hit>0?18:8;ctx.beginPath();ctx.arc(p.x,p.y,e.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=e.bind>0?'#9ee7ff':'rgba(255,80,80,.55)';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(p.x-16,p.y-e.r-10,32,4);ctx.fillStyle='#ff6b6b';ctx.fillRect(p.x-16,p.y-e.r-10,32*Math.max(0,e.hp/e.max),4)}
for(const s of slashes){let p=ws(s.x,s.y),q=s.life/s.max;ctx.strokeStyle=s.color||'rgba(190,220,255,.9)';ctx.shadowColor=s.color||'#bfdbfe';ctx.shadowBlur=18;ctx.lineWidth=12*q+3;ctx.beginPath();ctx.arc(p.x,p.y,s.r,-.75+s.a,.75+s.a);ctx.stroke();ctx.shadowBlur=0}
for(const b of booms){let p=ws(b.x,b.y),q=1-b.life/b.max;ctx.strokeStyle='rgba(255,210,80,.95)';ctx.lineWidth=8*(1-q)+2;ctx.shadowColor='#ffb84d';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(p.x,p.y,b.r*q,0,7);ctx.stroke();ctx.fillStyle='rgba(255,80,20,.20)';ctx.beginPath();ctx.arc(p.x,p.y,b.r*q*.75,0,7);ctx.fill();ctx.shadowBlur=0}
for(const sp of sparks){let p=ws(sp.x,sp.y);ctx.globalAlpha=Math.max(0,sp.life/sp.max);ctx.fillStyle=sp.color;ctx.shadowColor=sp.color;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x,p.y,sp.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1}for(const tx of texts){let p=ws(tx.x,tx.y);ctx.globalAlpha=Math.max(0,tx.life/.62);ctx.font='900 18px system-ui';ctx.fillStyle=tx.color;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=4;ctx.strokeText(tx.t,p.x,p.y);ctx.fillText(tx.t,p.x,p.y);ctx.globalAlpha=1}
let p=ws(player.x,player.y);let aura=ctx.createRadialGradient(p.x,p.y,5,p.x,p.y,55);aura.addColorStop(0,'rgba(168,85,247,.40)');aura.addColorStop(1,'rgba(168,85,247,0)');ctx.fillStyle=aura;ctx.beginPath();ctx.arc(p.x,p.y,58,0,7);ctx.fill();ctx.save();ctx.translate(p.x,p.y);ctx.rotate(player.angle);ctx.shadowColor='#a78bfa';ctx.shadowBlur=22;ctx.fillStyle='#29105f';ctx.strokeStyle='#d8b4fe';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(26,0);ctx.lineTo(-15,-13);ctx.lineTo(-7,0);ctx.lineTo(-15,13);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.restore();
if(joy.active){ctx.fillStyle='rgba(255,142,30,.13)';ctx.beginPath();ctx.arc(joy.cx,joy.cy,170,0,7);ctx.fill();ctx.strokeStyle='rgba(129,224,238,.9)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(joy.cx,joy.cy,78,0,7);ctx.stroke();ctx.fillStyle='rgba(160,230,240,.48)';ctx.beginPath();ctx.arc(joy.x,joy.y,42,0,7);ctx.fill();ctx.strokeStyle='rgba(220,255,255,.9)';ctx.stroke()}}
let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}ui();for(let i=0;i<6;i++)spawnEnemy();requestAnimationFrame(loop);
