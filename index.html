<!DOCTYPE html><html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mobile Survivor Reset</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:white;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh;background:#05070d}
#ui{position:fixed;inset:0;pointer-events:none;color:#e6fbff;font-weight:900;text-shadow:0 0 8px #7dd3fc}
#left{position:absolute;left:16px;top:18px;font-size:22px;line-height:1.5}
#right{position:absolute;right:16px;top:18px;text-align:right;font-size:18px;line-height:1.5}
#expBox{position:absolute;left:18px;right:18px;top:92px;height:14px;background:#052e16;border:1px solid #22c55e;border-radius:999px;overflow:hidden;box-shadow:0 0 12px #22c55e inset}
#expBar{height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#bef264,#fff)}
#hpBox{position:absolute;left:18px;top:115px;width:170px;height:12px;background:#450a0a;border:1px solid #ef4444;border-radius:999px;overflow:hidden}
#hpBar{height:100%;width:100%;background:linear-gradient(90deg,#ef4444,#f97316)}
#weapons{position:absolute;left:16px;bottom:18px;font-size:13px;line-height:1.5;background:rgba(15,23,42,.65);border:1px solid rgba(148,163,184,.3);padding:9px 11px;border-radius:12px;max-width:58%}
#toast{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:12px 16px;font-size:20px;text-align:center;white-space:pre-line;opacity:0;transition:.2s}
.overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.78);z-index:10;pointer-events:auto}.panel{width:min(92vw,440px);background:#0f172a;border:1px solid #60a5fa;border-radius:22px;padding:18px;box-shadow:0 0 50px #000}.panel h1,.panel h2{text-align:center;margin:0 0 14px}.panel p{color:#bfdbfe;line-height:1.55;font-weight:700}.btn,.choice{display:block;width:100%;margin:10px 0;padding:15px;border-radius:15px;border:1px solid #3b82f6;background:#1e3a8a;color:white;font-weight:900;font-size:16px}.choice{text-align:left}.choice small{display:block;color:#bfdbfe;margin-top:4px}.combo{background:#78350f;border-color:#f59e0b}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="left">Lv. <span id="lv">1</span><br><span id="mainWeapon">🔫 기관총 Lv.1</span><br><span style="font-size:14px">KILL <span id="killText">0</span></span></div>
  <div id="right">TIME <span id="timeText">0:00</span><br>EXP <span id="expText">0/5</span><br>DANGER <span id="dangerText">1</span></div>
  <div id="expBox"><div id="expBar"></div></div>
  <div id="hpBox"><div id="hpBar"></div></div>
  <div id="weapons"></div>
  <div id="toast"></div>
</div>
<div id="menu" class="overlay"><div class="panel"><h1>RESET SURVIVOR</h1><p>완전 초기화 버전. 조이스틱은 항상 왼쪽 아래에 표시된다. 손가락으로 조이스틱을 누르고 움직이면 캐릭터가 이동한다.</p><button class="btn" onclick="startGame()">게임 시작</button></div></div>
<div id="levelPanel" class="overlay"><div class="panel"><h2>LEVEL UP</h2><div id="choices"></div></div></div>
<div id="gameover" class="overlay"><div class="panel"><h2>GAME OVER</h2><p id="result"></p><button class="btn" onclick="startGame()">다시 시작</button></div></div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=innerWidth; H=innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  joy.baseX=95; joy.baseY=H-105; joy.x=joy.baseX; joy.y=joy.baseY;
}
window.addEventListener('resize',resize);const weaponData={ gun:['🔫','기관총'], missile:['🔮','매직미사일'], lightning:['⚡','낙뢰'], sword:['⚔️','검'], boomerang:['🪃','부메랑'], laser:['🔴','레이저'], blackhole:['🌑','블랙홀'], skull:['💀','해골'], chain:['🔗','체인'] }; const comboList=[ ['gun','missile','multiMissile','🚀','다연장 추적포'], ['gun','skull','poisonGun','☠️','독탄기관총'], ['lightning','chain','stormnet','🌩️','뇌전망'], ['lightning','laser','plasmaBeam','☄️','플라즈마 빔'], ['sword','boomerang','stormSword','🌪️','폭풍검'], ['blackhole','boomerang','gravityScythe','🌀','중력낫'] ];

let running=false, paused=false; let player,cam,owned,combos,level,exp,need,kills,time,keys={}; let enemies=[],bullets=[],gems=[],areas=[],particles=[],slashes=[],rings=[]; let timers={}; const joy={baseX:95,baseY:500,x:95,y:500,dx:0,dy:0,active:false,id:null,radius:72,knob:34};

function rand(a,b){return Math.random()*(b-a)+a;} function dist(a,b,c,d){return Math.hypot(a-c,b-d);} function screen(x,y){return {x:x-cam.x+W/2,y:y-cam.y+H/2};} function fmt(t){t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');} function danger(){return 1+Math.floor(time/18)+Math.floor(level/6);} function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,900);}

function resetGame(){ player={x:0,y:0,r:18,hp:130,maxHp:130,speed:260,angle:0,inv:0}; cam={x:0,y:0,shake:0}; owned={gun:1,missile:1,lightning:1}; combos={}; level=1; exp=0; need=5; kills=0; time=0; enemies=[]; bullets=[]; gems=[]; areas=[]; particles=[]; slashes=[]; rings=[]; timers={spawn:0,gun:0,missile:0,lightning:0,sword:0,boomerang:0,laser:0,blackhole:0,chain:0}; for(let i=0;i<25;i++)spawnEnemy(); updateUI(); } function startGame(){ document.querySelectorAll('.overlay').forEach(e=>e.style.display='none'); resetGame(); running=true; paused=false; toast('START'); } window.startGame=startGame;

function spawnEnemy(boss=false){ if(enemies.length>360)return; const side=Math.floor(rand(0,4)); let x=player.x,y=player.y; const margin=360; if(side===0){x+=rand(-W/2,W/2);y-=margin;} if(side===1){x+=rand(-W/2,W/2);y+=margin;} if(side===2){x-=margin;y+=rand(-H/2,H/2);} if(side===3){x+=margin;y+=rand(-H/2,H/2);} const elite=!boss && Math.random()<Math.min(.15,time/260); const hp=(5+danger()3+time/12)(boss?22:elite?5:1); const r=boss?42:elite?26:18; const speed=(75+Math.min(120,time1.2))(boss?.65:elite?.9:1); enemies.push({x,y,r,hp,maxHp:hp,speed,boss,elite,hit:0,poison:0,bind:0}); } function addGem(x,y,value=1){gems.push({x,y,r:7,value,spin:rand(0,6)});} function particle(x,y,color,count=10,power=170){ for(let i=0;i<count && particles.length<700;i++){ const a=rand(0,Math.PI2),s=rand(power.2,power); particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rand(2,5),life:rand(.25,.7),max:.7,color}); } } function ring(x,y,color,r=80){rings.push({x,y,color,r,life:.35,max:.35});} function area(x,y,r,life,dmg,type,a=0,len=0){areas.push({x,y,r,life,max:life,dmg,type,a,len});} function nearestEnemy(){ let best=null,bestD=999999; for(const e of enemies){const d=dist(player.x,player.y,e.x,e.y);if(d<bestD){best=e;bestD=d;}} return best; } function shoot(type,a,opt={}){ if(bullets.length>550)return; const sp=opt.sp||650; bullets.push({ type,x:player.x+Math.cos(a)*26,y:player.y+Math.sin(a)*26, vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:opt.r||6,life:opt.life||1.4,dmg:opt.dmg||2, color:opt.color||'#fff36a',homing:!!opt.homing,pierce:opt.pierce||0,poison:opt.poison||0,boom:opt.boom||0 }); }

window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true); window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false); canvas.addEventListener('pointerdown',e=>{ joy.active=true; joy.id=e.pointerId; canvas.setPointerCapture(e.pointerId); moveJoystick(e.clientX,e.clientY); }); canvas.addEventListener('pointermove',e=>{if(joy.active&&e.pointerId===joy.id)moveJoystick(e.clientX,e.clientY);}); canvas.addEventListener('pointerup',e=>{if(e.pointerId===joy.id)releaseJoystick();}); canvas.addEventListener('pointercancel',releaseJoystick); function moveJoystick(px,py){ let dx=px-joy.baseX,dy=py-joy.baseY; const d=Math.hypot(dx,dy); if(d>joy.radius){dx=dx/djoy.radius;dy=dy/djoy.radius;} joy.dx=dx/joy.radius; joy.dy=dy/joy.radius; joy.x=joy.baseX+dx; joy.y=joy.baseY+dy; } function releaseJoystick(){joy.active=false;joy.dx=0;joy.dy=0;joy.x=joy.baseX;joy.y=joy.baseY;}

function gainExp(v){ exp+=v; while(exp>=need){ exp-=need; level++; need=Math.floor(need*1.35+4); openLevelUp(); } updateUI(); } function openLevelUp(){ paused=true; const pool=[]; for(const k of Object.keys(weaponData)){ if(!owned[k])pool.push({k,text:${weaponData[k][0]} ${weaponData[k][1]} 획득,desc:'새 무기'}); else if(owned[k]<8)pool.push({k,text:${weaponData[k][0]} ${weaponData[k][1]} Lv.${owned[k]+1},desc:'강화'}); } for(const c of comboList){ if(owned[c[0]]&&owned[c[1]]&&!combos[c[2]])pool.unshift({combo:c,text:${c[3]} ${c[4]} 조합,desc:${weaponData[c[0]][1]} + ${weaponData[c[1]][1]}}); } const picks=pool.sort(()=>Math.random()-.5).slice(0,3); window.levelChoices=picks; choices.innerHTML=picks.map((p,i)=><button class="choice ${p.combo?'combo':''}" onclick="pickLevel(${i})">${p.text}<small>${p.desc}</small></button>).join(''); levelPanel.style.display='grid'; } function pickLevel(i){ const p=window.levelChoices[i]; if(!p)return; if(p.combo){combos[p.combo[2]]=true;toast(${p.combo[3]} ${p.combo[4]} 완성);particle(player.x,player.y,'#f59e0b',80,480);ring(player.x,player.y,'#f59e0b',220);} else{owned[p.k]=(owned[p.k]||0)+1;toast(${weaponData[p.k][0]} ${weaponData[p.k][1]} 강화);} paused=false; levelPanel.style.display='none'; updateUI(); } window.pickLevel=pickLevel;

function weaponUpdate(dt){ const target=nearestEnemy(); const a=target?Math.atan2(target.y-player.y,target.x-player.x):player.angle; if(owned.gun&&(timers.gun-=dt)<=0){ const n=combos.multiMissile?4:1; for(let i=0;i<n;i++)shoot('gun',a+rand(-.22,.22),{dmg:2+owned.gun*.8,homing:!!combos.multiMissile,poison:combos.poisonGun?1:0,color:combos.poisonGun?'#70ff4f':'#fff36a'}); timers.gun=combos.multiMissile?.035:Math.max(.05,.18-owned.gun*.015); } if(owned.missile&&(timers.missile-=dt)<=0){ const n=owned.missile+(combos.multiMissile?8:0); for(let i=0;i<n;i++)shoot('missile',a+rand(-1.4,1.4),{dmg:4,homing:true,sp:520,r:8,color:'#c084fc',boom:combos.multiMissile?.35:0}); timers.missile=combos.multiMissile?.14:.7; } if(owned.lightning&&(timers.lightning-=dt)<=0){ const n=owned.lightning2+(combos.stormnet?20:0); for(let i=0;i<n;i++){const e=enemies[Math.floor(Math.random()enemies.length)];if(e){area(e.x,e.y,combos.stormnet?82:55,.18,4,'lightning');particle(e.x,e.y,'#7dd3fc',10,220);}} timers.lightning=combos.stormnet?.12:.55; } if(owned.sword&&(timers.sword-=dt)<=0){ const n=combos.stormSword?4:1; for(let i=0;i<n;i++)slashes.push({x:player.x,y:player.y,a:a+iMath.PI2/n,r:90+owned.sword12,life:.25,max:.25,dmg:4+owned.sword,color:'#bfdbfe'}); timers.sword=combos.stormSword?.35:.75; } if(owned.boomerang&&(timers.boomerang-=dt)<=0){ const n=combos.gravityScythe?5:2; for(let i=0;i<n;i++)shoot('boomerang',a+rand(-1.4,1.4),{sp:430,life:2.1,r:17,dmg:6,pierce:999,color:'#67e8f9',boom:combos.gravityScythe?1:0}); timers.boomerang=combos.gravityScythe?.4:1; } if(owned.laser&&(timers.laser-=dt)<=0){ const beams=combos.plasmaBeam?4:1; for(let i=0;i<beams;i++){const aa=a+(i-(beams-1)/2).35,len=Math.max(W,H)*1.2;area(player.x+Math.cos(aa)*len/2,player.y+Math.sin(aa)*len/2,42,.45,combos.plasmaBeam?7:4,'laser',aa,len);} timers.laser=combos.plasmaBeam?.38:.85; } if(owned.blackhole&&(timers.blackhole-=dt)<=0){ const aa=a+rand(-Math.PI,Math.PI);area(player.x+Math.cos(aa)*190,player.y+Math.sin(aa)190,125,2.4,2,'blackhole'); timers.blackhole=2; } if(owned.chain&&(timers.chain-=dt)<=0){ const limit=Math.min(enemies.length,owned.chain4+(combos.stormnet?16:0)); for(let i=0;i<limit;i++){const e=enemies[i];if(dist(player.x,player.y,e.x,e.y)<480){e.bind=.8;e.hp-=4;}} timers.chain=combos.stormnet?.1:.45; } }

function update(dt){ if(!running||paused)return; time+=dt; let mx=0,my=0; if(keys.w||keys.arrowup)my--; if(keys.s||keys.arrowdown)my++; if(keys.a||keys.arrowleft)mx--; if(keys.d||keys.arrowright)mx++; if(joy.dx||joy.dy){mx=joy.dx;my=joy.dy;} const m=Math.hypot(mx,my); if(m>0){mx/=m;my/=m;player.x+=mxplayer.speeddt;player.y+=myplayer.speeddt;player.angle=Math.atan2(my,mx);} player.inv=Math.max(0,player.inv-dt); cam.x=player.x+rand(-cam.shake,cam.shake); cam.y=player.y+rand(-cam.shake,cam.shake); cam.shake=Math.max(0,cam.shake-35dt); timers.spawn-=dt; if(timers.spawn<=0){ const wave=Math.min(32,5+Math.floor(time/6)+Math.floor(level/3)); for(let i=0;i<wave;i++)spawnEnemy(false); if(Math.floor(time)%45===0)spawnEnemy(true); timers.spawn=Math.max(.08,.42-time/240); } weaponUpdate(dt); for(const b of bullets){ if(b.homing){const e=nearestEnemy();if(e){const aa=Math.atan2(e.y-b.y,e.x-b.x);b.vx=b.vx.86+Math.cos(aa)720.14;b.vy=b.vy*.86+Math.sin(aa)720.14;}} b.x+=b.vxdt;b.y+=b.vydt;b.life-=dt; if(b.boom&&Math.random()<.16){area(b.x,b.y,56,.2,4,'boom');ring(b.x,b.y,'#fbbf24',70);} } bullets=bullets.filter(b=>b.life>0); for(const e of enemies){ const aa=Math.atan2(player.y-e.y,player.x-e.x),sp=e.bind>0?e.speed*.2:e.speed; e.x+=Math.cos(aa)spdt;e.y+=Math.sin(aa)spdt;e.hit=Math.max(0,e.hit-dt);e.bind=Math.max(0,e.bind-dt); if(e.poison>0){e.hp-=e.poisondt2;e.poison-=dt*.2;} if(dist(e.x,e.y,player.x,player.y)<e.r+player.r&&player.inv<=0){ player.hp-=e.boss?30:e.elite?18:10;player.inv=.4;cam.shake=9;particle(player.x,player.y,'#ef4444',25,280); if(player.hp<=0){running=false;gameover.style.display='grid';result.innerHTML=TIME ${fmt(time)}<br>KILL ${kills}<br>LEVEL ${level};} } } for(const ar of areas){ ar.life-=dt; for(const e of enemies){ let hit=false; if(ar.type==='laser'){ const sx=ar.x-Math.cos(ar.a)ar.len/2,sy=ar.y-Math.sin(ar.a)ar.len/2; const px=e.x-sx,py=e.y-sy; const proj=Math.max(0,Math.min(ar.len,pxMath.cos(ar.a)+pyMath.sin(ar.a))); const lx=sx+Math.cos(ar.a)proj,ly=sy+Math.sin(ar.a)proj; hit=dist(e.x,e.y,lx,ly)<ar.r; }else hit=dist(e.x,e.y,ar.x,ar.y)<ar.r; if(hit){e.hp-=ar.dmgdt10;e.hit=.05;if(ar.type==='blackhole'){e.x+=(ar.x-e.x)dt1.7;e.y+=(ar.y-e.y)dt1.7;}} } } areas=areas.filter(a=>a.life>0); slashes=slashes.filter(s=>(s.life-=dt)>0); rings=rings.filter(r=>(r.life-=dt)>0); for(const p of particles){p.x+=p.vxdt;p.y+=p.vydt;p.vx*=.91;p.vy*=.91;p.life-=dt;} particles=particles.filter(p=>p.life>0); for(const b of bullets){ for(const e of enemies){ if(e.hp>0&&dist(b.x,b.y,e.x,e.y)<b.r+e.r){ e.hp-=b.dmg;e.hit=.08;particle(e.x,e.y,b.poison?'#65ff4a':'#fff36a',7,160); if(b.poison)e.poison+=2.2; if(b.boom){area(e.x,e.y,62,.2,5,'boom');ring(e.x,e.y,'#fbbf24',80);} if(b.pierce>0)b.pierce--;else b.life=0; break; } } } for(const s of slashes){for(const e of enemies){if(dist(s.x,s.y,e.x,e.y)<s.r){e.hp-=s.dmgdt12;e.hit=.05;}}} for(const e of enemies){ if(e.hp<=0&&!e.dead){ e.dead=true;kills++; const n=e.boss?20:e.elite?6:1; for(let i=0;i<n;i++)addGem(e.x+rand(-22,22),e.y+rand(-22,22),e.boss?2:1); particle(e.x,e.y,e.boss?'#fb923c':e.elite?'#facc15':'#ff7070',e.boss?70:18,e.boss?500:240); ring(e.x,e.y,e.boss?'#fb923c':e.elite?'#facc15':'#ff7070',e.boss?180:70); } } enemies=enemies.filter(e=>!e.dead); for(const g of gems){ g.spin+=dt*8; const dd=dist(g.x,g.y,player.x,player.y); if(dd<190){const aa=Math.atan2(player.y-g.y,player.x-g.x);g.x+=Math.cos(aa)520dt;g.y+=Math.sin(aa)520dt;} if(dd<player.r+g.r+10){g.dead=true;gainExp(g.value);} } gems=gems.filter(g=>!g.dead); updateUI(); }

function updateUI(){ lv.textContent=level;killText.textContent=kills;timeText.textContent=fmt(time);expText.textContent=exp+'/'+need;dangerText.textContent=danger(); expBar.style.width=Math.min(100,exp/need100)+'%';hpBar.style.width=Math.max(0,player.hp/player.maxHp100)+'%'; const list=[...Object.entries(owned).map(([k,v])=>${weaponData[k][0]} ${weaponData[k][1]} Lv.${v}),...Object.entries(combos).map(([k])=>{const c=comboList.find(x=>x[2]===k);return ${c[3]} ${c[4]};})]; mainWeapon.textContent=list[0]||'';weapons.innerHTML=list.join('<br>'); }

function drawGrid(){ const grad=ctx.createRadialGradient(W/2,H/2,70,W/2,H/2,Math.max(W,H)); grad.addColorStop(0,'#0b1730');grad.addColorStop(.5,'#07101a');grad.addColorStop(1,'#02040a'); ctx.fillStyle=grad;ctx.fillRect(0,0,W,H); const size=96,ox=(-cam.x%size)+W/2%size,oy=(-cam.y%size)+H/2%size; ctx.strokeStyle='rgba(45,70,110,.45)';ctx.lineWidth=2; for(let x=ox-size;x<W+size;x+=size){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();} for(let y=oy-size;y<H+size;y+=size){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();} } function draw(){ drawGrid(); for(const ar of areas){ const p=screen(ar.x,ar.y);ctx.globalAlpha=Math.max(.18,ar.life/ar.max*.55); if(ar.type==='laser'){ ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ar.a);ctx.fillStyle=combos.plasmaBeam?'#fb5522':'#ff2255';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=22;ctx.fillRect(-ar.len/2,-15,ar.len,30);ctx.fillStyle='#fff';ctx.fillRect(-ar.len/2,-4,ar.len,8);ctx.restore();ctx.shadowBlur=0; }else{ ctx.fillStyle=ar.type==='blackhole'?'#2b145f':ar.type==='lightning'?'#7dd3fc':'#f59e0b';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(p.x,p.y,ar.r,0,Math.PI2);ctx.fill();ctx.shadowBlur=0; } ctx.globalAlpha=1; } for(const g of gems){const p=screen(g.x,g.y);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(g.spin);ctx.fillStyle='#c6d84a';ctx.shadowColor='#eaff68';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(9,0);ctx.lineTo(0,10);ctx.lineTo(-9,0);ctx.closePath();ctx.fill();ctx.restore();ctx.shadowBlur=0;} for(const b of bullets){const p=screen(b.x,b.y);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(b.vy,b.vx));ctx.fillStyle=b.color;ctx.strokeStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=14;ctx.beginPath();if(b.type==='boomerang'){ctx.arc(0,0,b.r,0.4,5.6);ctx.lineWidth=6;ctx.stroke();}else{ctx.arc(0,0,b.r,0,Math.PI2);ctx.fill();}ctx.restore();ctx.shadowBlur=0;} for(const e of enemies){ const p=screen(e.x,e.y);ctx.fillStyle=e.boss?'#7f1d1d':e.elite?'#d97706':e.poison>0?'#65a33a':e.hit>0?'#ffb4b4':'#dc2626';ctx.shadowColor=e.boss?'#fb923c':e.elite?'#facc15':'#ef4444';ctx.shadowBlur=e.hit>0?18:8;ctx.beginPath();ctx.arc(p.x,p.y,e.r,0,Math.PI2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=e.bind>0?'#9ee7ff':'rgba(255,120,120,.7)';ctx.lineWidth=e.boss?6:4;ctx.stroke(); ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(p.x-e.r,p.y-e.r-11,e.r2,4);ctx.fillStyle=e.boss?'#fb923c':'#ff7070';ctx.fillRect(p.x-e.r,p.y-e.r-11,e.r2Math.max(0,e.hp/e.maxHp),4); } for(const s of slashes){const p=screen(s.x,s.y);ctx.strokeStyle=s.color;ctx.shadowColor=s.color;ctx.shadowBlur=18;ctx.lineWidth=8+10s.life/s.max;ctx.beginPath();ctx.arc(p.x,p.y,s.r,s.a-.8,s.a+.8);ctx.stroke();ctx.shadowBlur=0;} for(const r of rings){const p=screen(r.x,r.y),q=1-r.life/r.max;ctx.globalAlpha=r.life/r.max;ctx.strokeStyle=r.color;ctx.shadowColor=r.color;ctx.shadowBlur=18;ctx.lineWidth=8(1-q)+2;ctx.beginPath();ctx.arc(p.x,p.y,r.rq,0,Math.PI2);ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=1;} for(const p0 of particles){const p=screen(p0.x,p0.y);ctx.globalAlpha=p0.life/p0.max;ctx.fillStyle=p0.color;ctx.shadowColor=p0.color;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x,p.y,p0.r,0,Math.PI2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;} const p=screen(player.x,player.y);const aura=ctx.createRadialGradient(p.x,p.y,5,p.x,p.y,65);aura.addColorStop(0,'rgba(168,85,247,.45)');aura.addColorStop(1,'rgba(168,85,247,0)');ctx.fillStyle=aura;ctx.beginPath();ctx.arc(p.x,p.y,65,0,Math.PI2);ctx.fill();ctx.save();ctx.translate(p.x,p.y);ctx.rotate(player.angle);ctx.shadowColor='#c084fc';ctx.shadowBlur=22;ctx.fillStyle=player.inv>0?'#fef3c7':'#5b21b6';ctx.strokeStyle='#e9d5ff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(-17,-15);ctx.lineTo(-8,0);ctx.lineTo(-17,15);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();ctx.shadowBlur=0; drawJoystick(); } function drawJoystick(){ ctx.save(); ctx.globalAlpha=.95; ctx.fillStyle='rgba(14,165,233,.12)';ctx.beginPath();ctx.arc(joy.baseX,joy.baseY,joy.radius+22,0,Math.PI2);ctx.fill(); ctx.strokeStyle='rgba(125,211,252,.95)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(joy.baseX,joy.baseY,joy.radius,0,Math.PI2);ctx.stroke(); ctx.fillStyle=joy.active?'rgba(186,230,253,.75)':'rgba(186,230,253,.42)';ctx.beginPath();ctx.arc(joy.x,joy.y,joy.knob,0,Math.PI*2);ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.stroke(); ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='900 12px Arial';ctx.textAlign='center';ctx.fillText('MOVE',joy.baseX,joy.baseY+5); ctx.restore(); } let last=performance.now(); function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);} resize();resetGame();menu.style.display='grid';requestAnimationFrame(loop); </script>
